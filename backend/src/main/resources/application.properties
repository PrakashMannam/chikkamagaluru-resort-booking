spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.booking.fixed-today=${FIXED_TODAY:}
app.rate-limit.booking-rpm=${RATE_LIMIT_BOOKING_RPM:10}
app.rate-limit.enquiry-max-requests=${RATE_LIMIT_ENQUIRY_MAX_REQUESTS:5}
app.rate-limit.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
enquiry.ai.confidence-threshold=${ENQUIRY_CONFIDENCE_THRESHOLD:0.80}

# Temporary technical validation ceiling for event enquiries (safety guard against overflow and abusive inputs; NOT a venue capacity claim)
app.enquiry.validation.max-event-guests=${MAX_EVENT_GUESTS:1000}

